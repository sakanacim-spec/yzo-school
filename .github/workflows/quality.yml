name: CI Quality Assurance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: yzo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Cohérence des langues (i18n)
        run: node validate-i18n.js

      - name: Tests de l’infrastructure CI
        run: npm run test:ci-infrastructure

      - name: Tests frontend
        run: npm run test:frontend

      - name: Tests backend
        run: npm run test:backend

      - name: Tests d’intégration PostgreSQL
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/yzo_test

      - name: Build Vite de production
        run: npm run build
